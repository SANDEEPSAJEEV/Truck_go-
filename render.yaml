# Render deployment blueprint.
#
# The database is NOT defined here — Postgres already lives on Neon and is reachable from
# anywhere, so Render only ever runs the API. That also keeps the data out of the free
# tier's 90-day expiry.
#
# `prisma migrate deploy` (not `migrate dev`) runs on every deploy: it applies committed
# migrations and never generates new ones or prompts, which is the only safe form for a
# non-interactive environment.
services:
  - type: web
    name: truckgo-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    # --include=dev is required: NODE_ENV=production (below) otherwise makes npm skip
    # devDependencies, and both the TypeScript compiler and the Prisma CLI live there.
    # Without them `prisma generate` and `tsc` are simply absent and the build fails.
    # Only the build needs them; the running server uses dist/ plus @prisma/client, which
    # is a runtime dependency.
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Staging only. Lets the SMS and KYC mocks run under NODE_ENV=production so the app
      # is testable before DLT registration and a Surepass account exist. OTP codes then
      # appear in the Render logs instead of arriving by SMS, and document checks are
      # simulated. REMOVE THIS before real drivers or customers use the service.
      - key: ALLOW_MOCK_PROVIDERS
        value: "1"
      # Set these in the Render dashboard — never commit secrets.
      #   DATABASE_URL             the Neon connection string
      #   JWT_ACCESS_SECRET        long random string
      #   JWT_REFRESH_SECRET       long random string (different from the access secret)
      #   JWT_VERIFICATION_SECRET  long random string (different again)
      #   CORS_ORIGINS             comma-separated web origins, if any
      #   RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET
      #   GOOGLE_MAPS_SERVER_KEY   once the key's Android restriction is removed
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_VERIFICATION_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false
